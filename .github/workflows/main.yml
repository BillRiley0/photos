name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name'
        required: false
        default: ''

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout photos repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: photos-repo

      - name: Clone Ente official repo
        run: |
          git clone --depth 1 https://github.com/ente-io/ente.git ente-monorepo

      - name: Replace photos folder with custom repo
        run: |
          rm -rf ente-monorepo/mobile/apps/photos
          cp -r photos-repo ente-monorepo/mobile/apps/photos

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache Rust cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('ente-monorepo/mobile/apps/photos/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('ente-monorepo/mobile/apps/photos/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache Rust cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('ente-monorepo/mobile/apps/photos/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Set up Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME"
          ls -la $ANDROID_NDK_HOME

      - name: Install melos
        run: |
          dart pub global activate melos

      - name: Bootstrap monorepo with melos
        working-directory: ente-monorepo/mobile
        run: |
          melos bootstrap

      - name: Generate Rust FFI bindings
        working-directory: ente-monorepo/mobile
        run: |
          melos run codegen:rust

      - name: Format Dart code
        working-directory: ente-monorepo/mobile/apps/photos
        run: |
          dart format . --set-exit-if-changed || true

      - name: Analyze Flutter code
        working-directory: ente-monorepo/mobile/apps/photos
        run: |
          flutter analyze . || true

      - name: Build APK (independent flavor)
        working-directory: ente-monorepo/mobile/apps/photos
        run: |
          flutter build apk \
            --release \
            --flavor independent \
            -v

      - name: Build APK (fdroid flavor)
        working-directory: ente-monorepo/mobile/apps/photos
        run: |
          flutter build apk \
            --release \
            --flavor fdroid \
            -v

      - name: List build artifacts
        working-directory: ente-monorepo/mobile/apps/photos
        run: |
          find build -name "*.apk" -type f
          ls -lah build/app/outputs/apk/*/release/ || echo "APK directory not found"

      - name: Get release info
        id: release_info
        working-directory: ente-monorepo/mobile/apps/photos
        run: |
          VERSION=$(grep "version:" pubspec.yaml | head -1 | sed 's/.*: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          RELEASE_NAME="${{ github.event.inputs.release_name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="Release $VERSION"
          fi
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          repository: BillRiley0/photos
          name: ${{ steps.release_info.outputs.release_name }}
          tag_name: ${{ github.ref_name || format('v{0}', steps.release_info.outputs.version) }}
          draft: false
          prerelease: ${{ contains(steps.release_info.outputs.version, 'alpha') || contains(steps.release_info.outputs.version, 'beta') || contains(steps.release_info.outputs.version, 'rc') }}
          files: |
            ente-monorepo/mobile/apps/photos/build/app/outputs/apk/independent/release/app-independent-release.apk
            ente-monorepo/mobile/apps/photos/build/app/outputs/apk/fdroid/release/app-fdroid-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apks
          path: ente-monorepo/mobile/apps/photos/build/app/outputs/apk/*/release/*.apk
          retention-days: 30
